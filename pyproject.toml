[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-probability-guide"
version = "2.1.0"
description = "Accessible desktop application for learning factorials, permutations, and combinations with TTS and modern GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "David Alejandro Cruz Palacios" },
]
dependencies = [
  "customtkinter>=5.2",
  "Pillow>=10.0",
  "pygame>=2.5",
  "pyttsx3>=2.90",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
probability-guide = "probability_guide.app:main"
guia-probabilidad = "probability_guide.app:main"

[project.urls]
Repository = "https://github.com/aledash3/accessible-probability-guide"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probability_guide = ["assets/*.png", "assets/*.mp4"]
